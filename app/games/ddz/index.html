<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>斗地主 · 单机</title>
  <link rel="stylesheet" href="../theme.css?v=2" />
  <link rel="stylesheet" href="ddz.css?v=7" />
  <link rel="stylesheet" href="shop.css?v=1" />
</head>
<body>
  <div id="app" class="ddz">
    <header class="ddz-topbar">
      <div class="ddz-brand">斗地主<span>单机</span></div>
      <button class="room-chip" id="roomChip" type="button" title="选择场次">新手场 · 底注 100</button>
      <span class="mult-chip" id="multChip" title="当前倍数">×1</span>
      <button class="wallet-chip" id="walletChip" type="button" title="打开盒豆小铺"><span>盒豆</span><strong id="walletBalance">3000</strong></button>
    </header>
    <main class="ddz-table">
      <!-- 左侧 AI -->
      <section class="seat seat-left" id="seat2">
        <div class="seat-head">
          <div class="avatar" id="avatar2" title="查看对手资料">🧔</div>
          <div class="seat-meta">
            <strong id="name2">阿福</strong>
            <span class="ai-title" id="title2" hidden></span>
            <span class="badge landlord-badge" hidden>地主</span>
            <small id="count2">17 张</small>
          </div>
        </div>
        <div class="backs" id="backs2"></div>
        <div class="bubble" id="bubble2"></div>
      </section>

      <!-- 桌面中央 -->
      <div class="center">
        <div class="bottom-area">
          <span class="bottom-label">底牌</span>
          <div id="bottomCards" class="bottom-cards"></div>
        </div>
        <div class="last-area">
          <div class="last-label" id="lastLabel">准备开始</div>
          <div id="lastCards" class="last-cards"></div>
        </div>
        <div class="message" id="message"></div>
      </div>

      <!-- 右侧 AI -->
      <section class="seat seat-right" id="seat1">
        <div class="seat-head">
          <div class="avatar" id="avatar1" title="查看对手资料">👩</div>
          <div class="seat-meta">
            <strong id="name1">小满</strong>
            <span class="ai-title" id="title1" hidden></span>
            <span class="badge landlord-badge" hidden>地主</span>
            <small id="count1">17 张</small>
          </div>
        </div>
        <div class="backs" id="backs1"></div>
        <div class="bubble" id="bubble1"></div>
      </section>

      <!-- 自己 -->
      <section class="self">
        <div class="self-head">
          <div class="avatar you" id="youAvatar">🙂</div>
          <strong>你</strong>
          <span class="self-title" id="selfTitle" hidden></span>
          <span class="badge landlord-badge" id="youLandlord" hidden>地主</span>
          <span class="self-count" id="count0">17 张</span>
        </div>
        <div class="action-bar" id="actionBar"></div>
        <div class="hand" id="hand"></div>
      </section>
    </main>

    <div class="overlay" id="overlay" hidden>
      <div class="overlay-card">
        <h2 id="resultTitle">游戏结束</h2>
        <p class="sub" id="resultSub"></p>
        <button class="result-shop-link" id="resultShopBtn" type="button">去小铺看看 →</button>
        <div class="actions">
          <button class="btn ghost" id="changeRoomBtn">换场</button>
          <button class="btn primary" id="againBtn">再来一局</button>
        </div>
      </div>
    </div>

    <div class="overlay" id="roomOverlay" hidden>
      <div class="overlay-card room-card">
        <h2>选择场次</h2>
        <p class="sub">盒豆只用于单机对局，不能充值或兑换。</p>
        <div class="room-wallet">我的盒豆 <strong id="roomBalance">3000</strong></div>
        <div class="room-list" id="roomList"></div>
        <p class="room-note" id="roomNote"></p>
        <button class="room-shop-link" id="roomShopBtn" type="button">盒豆小铺 →</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="shop.js?v=1"></script>
  <script src="opponents.js?v=1"></script>
  <script src="ddz.js?v=8"></script>
</body>
</html>
