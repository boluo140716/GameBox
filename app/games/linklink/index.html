<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>消消乐 · 单机</title>
  <link rel="stylesheet" href="../theme.css?v=2" />
  <link rel="stylesheet" href="linklink.css?v=5" />
</head>
<body>
  <div id="app" class="m3">
    <header class="m3-top">
      <div class="m3-brand">
        <div class="m3-mark" aria-hidden="true">🍬</div>
        <div class="m3-brandtext">
          <h1>消消乐</h1>
          <p>相邻滑动 · 三连消除</p>
        </div>
      </div>

      <div class="m3-stats" aria-live="polite">
        <div class="m3-stat m3-stat-level">
          <small>关卡</small>
          <strong id="level">1</strong>
        </div>
        <div class="m3-stat">
          <small>得分</small>
          <strong id="score">0</strong>
        </div>
        <div class="m3-stat">
          <small>目标</small>
          <strong id="target">2200</strong>
        </div>
        <div class="m3-stat m3-stat-moves">
          <small>步数</small>
          <strong id="moves">24</strong>
        </div>
      </div>

      <div class="m3-tools">
        <div class="diffs" id="diffs" role="group" aria-label="难度">
          <button class="chip" data-diff="easy" type="button">轻松</button>
          <button class="chip active" data-diff="normal" type="button">标准</button>
          <button class="chip" data-diff="hard" type="button">挑战</button>
        </div>
        <div class="m3-btns">
          <button id="soundBtn" class="btn icon" type="button" aria-label="音效开关" aria-pressed="true" title="音效已开">🔊</button>
          <button id="hintBtn" class="btn" type="button">💡 提示</button>
          <button id="shuffleBtn" class="btn" type="button">🔀 洗牌</button>
          <button id="restartBtn" class="btn primary" type="button">↻ 重开</button>
        </div>
      </div>
    </header>

    <main class="m3-main" id="main">
      <div class="board-shell" id="boardShell">
        <div class="shell-aura" aria-hidden="true"></div>
        <div class="board" id="board" aria-label="消消乐棋盘"></div>
        <canvas class="fx" id="fx" aria-hidden="true"></canvas>
        <div class="combo" id="combo" aria-live="polite"></div>
        <div class="flash" id="flash" aria-hidden="true"></div>
      </div>
    </main>

    <footer class="m3-foot">
      <div class="m3-progress" aria-hidden="true">
        <div class="bar" id="progressBar"></div>
      </div>
      <div class="m3-footinfo">
        <span id="statusText">滑动或点击相邻图块交换</span>
        <span class="m3-best">最高 <strong id="best">0</strong></span>
      </div>
    </footer>

    <div class="overlay" id="overlay" hidden>
      <div class="overlay-card m3-result">
        <div class="m3-stars" id="stars" aria-hidden="true">
          <span>★</span><span>★</span><span>★</span>
        </div>
        <h2 id="resultTitle">过关！</h2>
        <p class="sub" id="resultSub"></p>
        <div class="m3-result-stats">
          <div>
            <small>本关得分</small>
            <strong id="resultScore">0</strong>
          </div>
          <div>
            <small>目标</small>
            <strong id="resultTarget">0</strong>
          </div>
        </div>
        <div class="actions">
          <button class="btn primary" id="nextBtn" type="button">下一关</button>
          <button class="btn ghost" id="retryBtn" type="button">再玩一次</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="../shared/sfx.js?v=2"></script>
  <script src="sfx.js?v=7"></script>
  <script src="linklink.js?v=5"></script>
</body>
</html>
