<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <title>2048 · 单机</title>
  <link rel="stylesheet" href="../theme.css?v=2" />
  <link rel="stylesheet" href="g2048.css?v=1" />
</head>
<body>
  <div id="app" class="g2048">
    <header class="g-top">
      <div class="g-brand">
        <div class="g-mark" aria-hidden="true">2048</div>
        <div class="g-brandtext">
          <h1>2048</h1>
          <p>滑动合并 · 冲击更高数字</p>
        </div>
      </div>

      <div class="g-stats" aria-live="polite">
        <div class="g-stat">
          <small>得分</small>
          <strong id="score">0</strong>
        </div>
        <div class="g-stat">
          <small>最高</small>
          <strong id="best">0</strong>
        </div>
      </div>

      <div class="g-actions">
        <button id="undoBtn" class="btn g-undo" type="button" disabled>↶ 撤销</button>
        <button id="newBtn" class="btn primary" type="button">新游戏</button>
      </div>
    </header>

    <main class="g-main" id="main">
      <div class="board-wrap" id="boardWrap">
        <div class="board" id="board" aria-label="2048 棋盘">
          <div class="grid-bg" id="gridBg" aria-hidden="true"></div>
          <div class="tile-layer" id="tileLayer"></div>
        </div>
      </div>
    </main>

    <footer class="g-foot">
      <span class="g-tip">方向键 / WASD / 手指滑动</span>
      <span id="status" class="g-status">合并相同数字，冲击 2048</span>
    </footer>

    <div class="overlay" id="overlay" hidden>
      <div class="overlay-card g-result">
        <div class="g-result-emblem" id="resultEmblem">2048</div>
        <h2 id="resultTitle">达成 2048！</h2>
        <p class="sub" id="resultSub"></p>
        <div class="g-result-stats">
          <div>
            <small>本局得分</small>
            <strong id="resultScore">0</strong>
          </div>
          <div>
            <small>最高分</small>
            <strong id="resultBest">0</strong>
          </div>
        </div>
        <div class="actions">
          <button class="btn primary" id="continueBtn" type="button">继续挑战</button>
          <button class="btn ghost" id="overNewBtn" type="button">重新开始</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="g2048.js?v=3"></script>
</body>
</html>
