<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#142b24" />
  <title>游戏盒 GameBox · 35 款经典小游戏</title>
  <link rel="stylesheet" href="hub.css?v=4" />
  <link rel="stylesheet" href="childhood/apps/board-game/board-skins.css?v=3" />
</head>
<body>
  <!-- ───────────── 首页 ───────────── -->
  <div id="home" class="screen">
    <header class="hero">
      <div class="brand">
        <div class="logo" aria-hidden="true">盒</div>
        <div class="brand-text">
          <span class="brand-kicker">GAMEBOX · 35 IN 1</span>
          <h1>游戏盒</h1>
          <p>35 款童年游戏 · 打开盒子，随时来一局</p>
        </div>
      </div>
      <label class="search">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="找一局：象棋 / 五子棋 / 华容道" autocomplete="off" />
      </label>
    </header>

    <section class="featured-wrap" id="featuredWrap">
      <div class="section-head">
        <h2>经典四件套</h2>
        <span class="section-note">四件最常被拿出来的</span>
      </div>
      <div class="featured" id="featured"></div>
    </section>

    <section class="recent-wrap" id="recentWrap" hidden>
      <div class="section-head">
        <h2>最近玩过</h2>
        <span class="section-note">点一下接着玩</span>
      </div>
      <div class="recent" id="recent"></div>
    </section>

    <nav class="chips" id="chips" aria-label="分类筛选">
      <button class="chip active" data-cat="all">全部 <em>35</em></button>
      <button class="chip" data-cat="fav">我的收藏 <em id="favCount">0</em></button>
      <button class="chip" data-cat="childhood">童年棋牌 <em>27</em></button>
      <button class="chip" data-cat="card">卡牌</button>
      <button class="chip" data-cat="table">牌桌 <em>3</em></button>
      <button class="chip" data-cat="arcade">街机休闲 <em>5</em></button>
    </nav>

    <main class="grid" id="grid" aria-live="polite"></main>
    <div class="empty" id="empty" hidden>没有找到这个游戏，换个关键词试试。</div>

    <footer class="foot">
      <p>童年棋牌来自 <strong>AloysHF/childhood</strong> · 2048、牌桌与街机玩法已重制为本地版</p>
      <p class="muted">已针对手机触屏适配 · 可离线游玩</p>
    </footer>
  </div>

  <!-- ───────────── 游戏页 ───────────── -->
  <section id="player" class="screen player" hidden>
    <header class="player-bar">
      <button id="backBtn" class="icon-btn" aria-label="返回游戏列表">←</button>
      <div class="player-title">
        <strong id="playerName">游戏</strong>
        <span id="playerHint">支持触屏</span>
      </div>
      <button id="fullBtn" class="icon-btn" aria-label="全屏" title="全屏">⛶</button>
      <button id="reloadBtn" class="icon-btn" aria-label="重新载入" title="重新开始">↻</button>
    </header>
    <div class="frame-wrap">
      <iframe id="gameFrame" title="游戏画面" allow="autoplay; fullscreen; gamepad" allowfullscreen></iframe>
      <div class="loader" id="loader"><span class="spinner"></span><span>正在进入游戏…</span></div>
    </div>
  </section>

  <script src="games.js?v=11"></script>
  <script src="childhood/js/rank.js?v=10"></script>
  <script src="childhood/apps/board-game/board-game-theme.js?v=3"></script>
  <script src="childhood/apps/board-game/board-skins.js?v=6"></script>
  <script src="hub.js?v=12"></script>
</body>
</html>
